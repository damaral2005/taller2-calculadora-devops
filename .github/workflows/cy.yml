name: CI - Calculadora

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version

      - name: Construir imágenes
        run: docker compose build


  test:
    name: Test Endpoints
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Levantar aplicación
        run: docker compose up -d --build

      - name: Mostrar contenedores
        run: docker compose ps

      - name: Ejecutar pruebas
        run: bash ./scripts/test_endpoints.sh

      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs

      - name: Apagar contenedores
        if: always()
        run: docker compose down