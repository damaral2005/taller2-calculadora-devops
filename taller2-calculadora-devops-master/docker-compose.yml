services:
  backend:
    build: ./backend
    image: taller2-calculadora-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./backend/operations.json:/app/operations.json

  frontend:
    build: ./frontend
    image: taller2-calculadora-frontend:latest
    ports:
      - "8080:8080"
    depends_on:
      - backend
